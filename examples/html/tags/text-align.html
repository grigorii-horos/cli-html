<!DOCTYPE html>
<html>
<body>
  <h1>Text Alignment</h1>

  <p>Default (left) aligned paragraph.</p>
  <p style="text-align: center">Centered with CSS text-align.</p>
  <p style="text-align: right">Right-aligned with CSS text-align.</p>
  <p align="center">Centered with the legacy align attribute.</p>

  <div style="text-align: end">
    <p>Alignment is inherited by the blocks inside a container.</p>
    <p>This paragraph is right-aligned too.</p>
  </div>

  <h2 style="text-align: center">Centered heading</h2>
</body>
</html>
